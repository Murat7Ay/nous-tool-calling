name: Release

# Push a tag like v0.1.0 to publish both packages to nuget.org.
on:
  push:
    tags: ['v*']

permissions:
  id-token: write   # NuGet Trusted Publishing (OIDC), no long-lived API key
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test -c Release
      - run: dotnet pack -c Release -o artifacts -p:Version=${GITHUB_REF_NAME#v}
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
